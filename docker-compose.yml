services:
  # ── Production image (built & served by Nginx) ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner         # use the final Nginx stage
    image: fuxion-business-hub:latest
    container_name: fuxion-hub
    ports:
      - "8081:80"            # access at http://localhost:8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Dev server (hot-reload via Vite) ─────────────────────────────────────────
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules     # anonymous volume so container node_modules wins
    ports:
      - "5173:5173"           # access at http://localhost:5173
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    profiles:
      - dev                  # only starts with: docker compose --profile dev up
